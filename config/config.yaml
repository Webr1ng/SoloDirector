project:
  name: SoloDirector
  title: "影石智拍导演"
  root: ".."

model:
  # The checkpoint is intentionally ignored by Git and is downloaded by Ultralytics on first use.
  path: models/yolo11n-pose.pt
  download_if_missing: true
  device: auto
  person_confidence: 0.35
  keypoint_confidence: 0.25
  max_persons: 8

video:
  sample_fps: 8.0
  pre_buffer_seconds: 2.0
  post_buffer_seconds: 2.0
  max_frames: null

events:
  merge_gap_seconds: 0.6
  stable_pose:
    duration_seconds: 3.0
    movement_threshold: 0.035
    min_completeness: 0.65
    min_person_confidence: 0.35
  hand_raise:
    minimum_duration_seconds: 0.35
    shoulder_margin: 0.04
    keypoint_confidence: 0.25
    min_person_confidence: 0.35
  jump:
    lookback_seconds: 0.8
    minimum_rise: 0.08
    minimum_descent: 0.05
    max_event_seconds: 2.5
    cooldown_seconds: 0.8
    min_person_confidence: 0.35

highlight:
  # Weights are normalized by the scorer; keeping them in YAML makes judging/demo tuning explicit.
  weights:
    confidence: 0.30
    motion_amplitude: 0.20
    completeness: 0.20
    composition: 0.15
    clarity: 0.15
  clarity_reference: 500.0

outputs:
  events_dir: outputs/events
  frames_dir: outputs/frames
  clips_dir: outputs/clips
  highlights_dir: outputs/highlights

api:
  host: 127.0.0.1
  port: 8000
  upload_dir: data/input/uploads
