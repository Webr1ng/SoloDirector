[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-director-insta360"
version = "0.1.0"
description = "SoloDirector: an Insta360-aware AI highlight director for pose-based event capture."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "ultralytics>=8.3,<9",
    "torch>=2.2,<3",
    "opencv-python>=4.8,<5",
    "numpy>=1.26,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "insta360/camera_bridge/build"]

[tool.ruff.lint]
select = ["E", "F", "I"]
